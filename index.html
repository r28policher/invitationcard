<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You have an invite! Andrei's 1st Birthday Race</title>
<meta name="description" content="You're invited to a race car birthday party. Tap the card to open your invitation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800&amp;family=Racing+Sans+One&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8EBF2;
    --card-shadow: #14161B;
    --red: #D42A26;
    --yellow: #FFC933;
    --asphalt: #14161B;
    --focus: #14161B;
    --display: "Racing Sans One", Impact, "Arial Narrow Bold", sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0C10;
      --card-shadow: #FFC933;
      --focus: #FFC933;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0C10;
    --card-shadow: #FFC933;
    --focus: #FFC933;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid; place-items: center;
    padding: 28px 20px 40px;
    background: var(--bg);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  p, h1, h2 { margin: 0; }

  .stage-wrap { position: relative; width: min(100%, 420px); }

  /* The whole card is one link */
  .card {
    container-type: inline-size;
    display: block;
    width: 100%;
    position: relative; overflow: hidden;
    background: var(--red); color: #fff;
    border: 3px solid var(--asphalt);
    border-radius: 30px;
    box-shadow: 10px 10px 0 var(--card-shadow);
    text-decoration: none;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translate(-3px, -3px); box-shadow: 13px 13px 0 var(--card-shadow); }
  .card:active { transform: translate(6px, 6px); box-shadow: 4px 4px 0 var(--card-shadow); }
  .card:focus-visible { outline: 4px solid var(--focus); outline-offset: 6px; }

  .flag {
    height: 7cqw;
    background: conic-gradient(#fff 25%, var(--asphalt) 0 50%, #fff 0 75%, var(--asphalt) 0) 0 0 / 7cqw 7cqw;
    border-bottom: 3px solid var(--asphalt);
    animation: flagShift 1.6s linear infinite;
  }
  @keyframes flagShift { from { background-position: 0 0; } to { background-position: 14cqw 0; } }

  .body { padding: 6cqw 7cqw 0; text-align: center; position: relative; }

  .sticker {
    display: inline-block; transform: rotate(-3deg);
    background: var(--yellow); color: var(--asphalt);
    font: 5.4cqw/1 var(--display);
    padding: 3cqw 4.4cqw; border-radius: 3cqw;
    border: 2.5px solid var(--asphalt);
    animation: wobble 2.6s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(2deg); }
  }
  .name  { margin-top: 4.5cqw; font: 9.5cqw/1 var(--display); display: block; }
  h1 { font: inherit; }
  .event { margin-top: 5cqw; font: 11.5cqw/1 var(--display); letter-spacing: .01em; display: block; }

  /* Celebrant photo frame */
  .photo { position: relative; width: 62cqw; margin: 4.5cqw auto 0; transform: rotate(-2deg); }
  .photo-ring {
    padding: 2.6cqw; border-radius: 6cqw;
    background: var(--yellow);
    border: 3px solid var(--asphalt);
    box-shadow: 2.4cqw 2.4cqw 0 var(--asphalt);
  }
  .photo-inner {
    position: relative; aspect-ratio: 1 / 1; overflow: hidden;
    border-radius: 3.6cqw; border: 3px solid var(--asphalt);
    background: linear-gradient(160deg, #fff, #dfe4f2);
  }
  .photo-inner img, .photo-inner svg.placeholder { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-corner {
    position: absolute; top: 0; left: 0; width: 15cqw; height: 15cqw;
    background: conic-gradient(#fff 25%, var(--asphalt) 0 50%, #fff 0 75%, var(--asphalt) 0) 0 0 / 5cqw 5cqw;
    border-right: 3px solid var(--asphalt); border-bottom: 3px solid var(--asphalt);
    border-bottom-right-radius: 3.6cqw; z-index: 2;
  }
  .badge {
    position: absolute; right: -5cqw; bottom: -5cqw; z-index: 3;
    width: 22cqw; height: 22cqw; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--red); color: #fff;
    border: 3px solid var(--asphalt);
    box-shadow: 1.4cqw 1.4cqw 0 var(--asphalt);
    font: 10.5cqw/1 var(--display);
    transform: rotate(8deg);
  }
  .badge::before {
    content: ""; position: absolute; inset: 1.4cqw; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.75);
  }

  .cta {
    margin-top: 5cqw;
    display: flex; align-items: center; justify-content: center; gap: 2.4cqw;
    min-height: 13cqw; border-radius: 999px;
    background: var(--yellow); color: var(--asphalt);
    border: 2.5px solid var(--asphalt);
    font-weight: 800; font-size: 4.6cqw;
    position: relative; overflow: hidden;
  }
  .cta::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.55) 12%, transparent 24%);
    background-size: 60cqw 100%;
    animation: shine 2.4s ease-in-out infinite;
  }
  @keyframes shine { 0% { background-position: -60cqw 0; } 60%, 100% { background-position: 60cqw 0; } }
  .cta span, .cta svg { position: relative; z-index: 1; }
  .cta svg { width: 5.4cqw; height: 5.4cqw; transition: transform .18s ease; }
  .card:hover .cta svg { transform: translateX(4px); }

  /* Track, continuously driving car, and racing decoration */
  .stage { position: relative; margin-top: 3cqw; }
  .lane { position: relative; height: 26cqw; z-index: 1; margin-bottom: -1.2cqw; overflow-x: hidden; overflow-y: visible; background: linear-gradient(180deg, transparent, rgba(0,0,0,.08)); }

  .cloud { position: absolute; top: 10%; opacity: .5; }
  .cloud svg { width: 16cqw; height: auto; fill: #fff; }
  .cloud.c1 { animation: driftBack 9s linear infinite; }
  .cloud.c2 { top: 30%; animation: driftBack 13s linear infinite; animation-delay: -5s; }
  @keyframes driftBack { from { transform: translateX(140cqw); } to { transform: translateX(-40cqw); } }

  .speedlines { position: absolute; left: 0; right: 0; bottom: 15cqw; height: 8cqw; pointer-events: none; }
  .speedlines span {
    position: absolute; height: 2px; width: 14cqw; right: -20cqw;
    background: rgba(255,255,255,.55); border-radius: 2px;
    animation: streak 1.1s linear infinite;
  }
  .speedlines span:nth-child(1) { top: 0; animation-delay: 0s; }
  .speedlines span:nth-child(2) { top: 3cqw; animation-delay: .25s; width: 10cqw; }
  .speedlines span:nth-child(3) { top: 6cqw; animation-delay: .5s; width: 18cqw; }
  @keyframes streak { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateX(-150cqw); opacity: 0; } }

  .carTrack {
    position: absolute; left: 0; right: 0; bottom: 0;
    animation: drive 4.5s linear infinite;
  }
  @keyframes drive {
    0%   { transform: translateX(-55cqw); }
    100% { transform: translateX(150cqw); }
  }
  .car { width: 46cqw; height: auto; overflow: visible; display: block; position: relative; z-index: 1; }
  .carTrack::after {
    content: ""; position: absolute; left: 50%; bottom: 0.3cqw;
    width: 34cqw; height: 2.6cqw; border-radius: 50%;
    background: rgba(0,0,0,.32);
    filter: blur(1.5px);
    transform: translateX(-50%);
  }
  .wheel {
    transform-box: fill-box; transform-origin: center;
    animation: spin .45s linear infinite;
  }
  .puff { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puff 1.1s ease-out infinite; }
  .puff.p2 { animation-delay: .35s; }
  .puff.p3 { animation-delay: .7s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes puff {
    0%   { opacity: 0; transform: translate(0,0) scale(.4); }
    15%  { opacity: .55; }
    100% { opacity: 0; transform: translate(-18px,-6px) scale(1.5); }
  }

  .road { position: relative; height: 15cqw; background: var(--asphalt); }
  .road::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3.4cqw;
    background: repeating-linear-gradient(90deg, #fff 0 5cqw, var(--asphalt) 5cqw 10cqw);
    border-top: 2px solid #fff;
  }
  .road::after {
    content: ""; position: absolute; left: 0; right: 0; top: 9cqw; height: 1.1cqw;
    background: repeating-linear-gradient(90deg, var(--yellow) 0 8cqw, transparent 8cqw 16cqw);
    animation: dashes 1s linear infinite;
  }
  @keyframes dashes { from { background-position: 0 0; } to { background-position: -16cqw 0; } }

  @media (prefers-reduced-motion: reduce) {
    .carTrack, .wheel, .puff, .road::after, .flag, .sticker, .cta::before, .cloud { animation: none !important; }
  }

  [hidden] { display: none !important; }
  .photo-inner img.celebrant { object-position: 50% var(--photo-y, 50%); }

  /* ---------- Owner-only editor (never shown to guests) ---------- */
  .edit-pill {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 46px; padding: 0 18px; border-radius: 999px;
    background: #14161B; color: #fff; border: 2.5px solid #FFC933;
    font: 800 .95rem/1 var(--body); cursor: pointer;
    box-shadow: 3px 3px 0 rgba(0,0,0,.25);
  }
  .edit-pill:focus-visible { outline: 3px solid #FFC933; outline-offset: 3px; }
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(10,10,14,.6);
    display: none; align-items: flex-start; justify-content: center;
    padding: 4vh 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    width: min(480px, 100%); background: #fff; color: #14161B;
    border-radius: 20px; padding: 24px 22px 22px; font-family: var(--body);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal h2 { font: 800 1.4rem/1.2 var(--body); margin: 0 0 4px; }
  .modal .hint { color: #4A5170; font-size: .88rem; margin: 0 0 16px; line-height: 1.5; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-weight: 700; font-size: .84rem; margin-bottom: 6px; }
  .field input[type="text"], .field input[type="url"] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid #C3C8D8; font: inherit; font-size: .95rem; color: #14161B; background: #fff;
  }
  .field input:focus-visible { outline: 3px solid #D42A26; outline-offset: 1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .colorRow { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 600; }
  .colorRow input[type="color"] { width: 42px; height: 38px; border: none; border-radius: 8px; padding: 0; background: none; }
  .photoRow { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .thumb { width: 76px; height: 76px; border-radius: 12px; border: 2px solid #14161B; background: #E3E8F5 center / cover no-repeat; flex: none; }
  .photoBtns { display: grid; gap: 8px; flex: 1; }
  .btn { min-height: 44px; border-radius: 999px; border: 2px solid #14161B; background: #fff; color: #14161B; font: 800 .9rem/1 var(--body); cursor: pointer; padding: 0 16px; }
  .btn.primary { background: #14161B; color: #fff; }
  .btn.ghost { border-color: #C3C8D8; color: #4A5170; font-weight: 700; }
  .btn:disabled { opacity: .6; cursor: default; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }
  .msg { min-height: 1.2em; margin-top: 10px; font-size: .88rem; font-weight: 600; color: #B3261E; }
  input[type="range"] { width: 100%; }
  fieldset { border: none; padding: 0; margin: 16px 0 0; }
  legend { font-weight: 800; font-size: .95rem; margin-bottom: 8px; padding: 0; }
</style>
</head>

  </a>

<script>
(function () {
  /* Pristine copy of the page, taken before anything changes, used to publish new versions. */
  var pristine = document.documentElement.cloneNode(true);

  var DEFAULTS = {
    sticker: "You have an invite!",
    childName: "Andrei's",
    ordinal: "1st",
    eventTitle: "Birthday Race",
    ctaText: "Tap to open your invitation",
    link: "https://r28policher.github.io/dedoybirthdayrace/",
    red: "#D42A26",
    yellow: "#FFC933",
    asphalt: "#14161B",
    photo: "",
    photoY: 50
  };
  var KEYS = Object.keys(DEFAULTS);
  var STORAGE_KEY = "andreiRaceInviteCard";
  var hasClaude = !!(window.claude && typeof window.claude.use === "function");

  function embedded() {
    try { return JSON.parse(document.getElementById("inviteState").textContent || "{}"); }
    catch (e) { return {}; }
  }
  function merge(base, extra) {
    var out = {};
    KEYS.forEach(function (k) { out[k] = (extra && extra[k] !== undefined) ? extra[k] : base[k]; });
    return out;
  }

  var state = merge(DEFAULTS, embedded());
  if (!hasClaude) {
    try { state = merge(state, JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")); } catch (e) {}
  }

  var card = document.getElementById("inviteCard");
  var photoImg = document.querySelector(".photo-inner img.celebrant");
  var photoSvg = document.querySelector(".photo-inner svg.placeholder");

  function apply(st) {
    document.querySelectorAll("[data-e]").forEach(function (el) {
      var k = el.getAttribute("data-e");
      if (st[k] !== undefined) el.textContent = st[k];
    });
    card.setAttribute("href", st.link || DEFAULTS.link);
    card.setAttribute("aria-label", st.childName + " " + st.ordinal + " " + st.eventTitle + ". Open your invitation.");
    var r = document.documentElement.style;
    r.setProperty("--red", st.red); r.setProperty("--yellow", st.yellow); r.setProperty("--asphalt", st.asphalt);
    r.setProperty("--photo-y", (st.photoY == null ? 50 : st.photoY) + "%");
    if (st.photo) {
      photoImg.src = st.photo; photoImg.alt = st.childName;
      photoImg.hidden = false; photoSvg.style.display = "none";
    } else {
      photoImg.hidden = true; photoImg.removeAttribute("src"); photoSvg.style.display = "";
    }
    document.title = "You have an invite! " + st.childName + " " + st.ordinal + " " + st.eventTitle;
  }
  apply(state);

  /* ---------------- Editor (owner only) ---------------- */
  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("decode")); };
        img.onload = function () {
          var max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.85));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function buildHtml(st) {
    var clone = pristine.cloneNode(true);
    clone.querySelector("#inviteState").textContent = JSON.stringify(st).replace(/</g, "\\u003c");
    return "<!DOCTYPE html>\n" + clone.outerHTML;
  }

  function buildEditor(mode, artifact) {
    var draft = merge(state, {});
    var pill = document.createElement("button");
    pill.type = "button"; pill.className = "edit-pill";
    pill.textContent = "Edit card";
    document.body.appendChild(pill);

    var ov = document.createElement("div");
    ov.className = "modal-overlay";
    ov.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">' +
      '<h2 id="edTitle">Edit invitation card</h2>' +
      '<p class="hint">' + (mode === "artifact"
        ? "Saving updates the page for everyone who opens the link."
        : "Saved in this browser only. Guests won\u2019t see changes made here.") + '</p>' +
      '<form id="edForm">' +
      '<fieldset style="margin-top:0"><legend>Celebrant photo</legend>' +
      '<div class="photoRow"><div class="thumb" id="edThumb"></div><div class="photoBtns">' +
      '<button type="button" class="btn primary" id="edPick">Attach photo</button>' +
      '<button type="button" class="btn ghost" id="edClear">Remove photo</button></div></div>' +
      '<input type="file" id="edFile" accept="image/*" hidden>' +
      '<label class="field"><span>Photo position (move up or down)</span><input type="range" id="f_photoY" min="0" max="100"></label>' +
      '</fieldset>' +
      '<label class="field"><span>Sticker text</span><input type="text" id="f_sticker" maxlength="30"></label>' +
      '<label class="field"><span>Name</span><input type="text" id="f_childName" maxlength="40"></label>' +
      '<div class="grid2">' +
      '<label class="field"><span>Badge (e.g. 1st)</span><input type="text" id="f_ordinal" maxlength="6"></label>' +
      '<label class="field"><span>Event title</span><input type="text" id="f_eventTitle" maxlength="30"></label></div>' +
      '<label class="field"><span>Button text</span><input type="text" id="f_ctaText" maxlength="40"></label>' +
      '<label class="field"><span>Link the card opens</span><input type="url" id="f_link" placeholder="https://..."></label>' +
      '<fieldset><legend>Colors</legend><div class="grid2">' +
      '<div class="colorRow"><input type="color" id="f_red"><span>Red</span></div>' +
      '<div class="colorRow"><input type="color" id="f_yellow"><span>Yellow</span></div></div>' +
      '<div class="colorRow" style="margin-top:10px"><input type="color" id="f_asphalt"><span>Dark</span></div></fieldset>' +
      '<p class="msg" id="edMsg" role="status"></p>' +
      '<div class="modal-actions"><button type="button" class="btn" id="edCancel">Cancel</button>' +
      '<button type="submit" class="btn primary" id="edSave">Save</button></div>' +
      '<button type="button" class="btn ghost" id="edReset" style="width:100%;margin-top:10px">Reset to defaults</button>' +
      '</form></div>';
    document.body.appendChild(ov);

    function $(id) { return document.getElementById(id); }
    var msg = $("edMsg");

    function fill() {
      KEYS.forEach(function (k) {
        var el = $("f_" + k);
        if (el) el.value = draft[k];
      });
      $("edThumb").style.backgroundImage = draft.photo ? 'url("' + draft.photo + '")' : "";
      msg.textContent = "";
    }
    function open() { draft = merge(state, {}); fill(); ov.classList.add("open"); $("edPick").focus(); }
    function close() { ov.classList.remove("open"); }

    pill.addEventListener("click", open);
    $("edCancel").addEventListener("click", close);
    ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

    KEYS.forEach(function (k) {
      var el = $("f_" + k);
      if (!el) return;
      el.addEventListener("input", function () {
        draft[k] = (k === "photoY") ? Number(el.value) : el.value;
        if (k === "photoY") { document.documentElement.style.setProperty("--photo-y", el.value + "%"); }
      });
    });

    $("edPick").addEventListener("click", function () { $("edFile").click(); });
    $("edFile").addEventListener("change", function () {
      var f = this.files && this.files[0];
      if (!f) return;
      msg.textContent = "Loading photo...";
      readPhoto(f).then(function (url) {
        draft.photo = url; fill(); msg.textContent = "";
      }).catch(function () {
        msg.textContent = "That photo could not be read. Try a JPG or PNG.";
      });
      this.value = "";
    });
    $("edClear").addEventListener("click", function () { draft.photo = ""; fill(); });
    $("edReset").addEventListener("click", function () { draft = merge(DEFAULTS, {}); fill(); });

    $("edForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var next = merge(draft, {});
      $("edSave").disabled = true; msg.textContent = "Saving...";
      if (mode === "artifact") {
        Promise.resolve(artifact.publish(buildHtml(next))).then(function () {
          state = next; apply(state); close(); $("edSave").disabled = false;
        }).catch(function (err) {
          $("edSave").disabled = false;
          msg.textContent = (err && err.code === "conflict")
            ? "The page changed elsewhere. It will reload with the latest version."
            : "Could not save. Please try again.";
        });
      } else {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (err) {}
        state = next; apply(state); close(); $("edSave").disabled = false;
      }
    });
  }

  function setup() {
    var go = Promise.resolve(null);
    if (hasClaude) {
      go = Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (r) {
        var user = r[0], artifact = r[1];
        if (!user || !artifact) return null;
        return Promise.all([user.isOwner(), user.canEdit()]).then(function (p) {
          return (p[0] || p[1]) ? { mode: "artifact", artifact: artifact } : null;
        });
      }).catch(function () { return null; });
    }
    go.then(function (res) {
      if (res) buildEditor(res.mode, res.artifact);
      else if (location.hash === "#edit" && !hasClaude) buildEditor("local", null);
    });
  }
  setup();
})();
</script></body></html>
